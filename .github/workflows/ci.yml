name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly run so newly published security advisories surface even
    # when nothing in the repository has changed.
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  # ext-intl is optional per composer.json (symfony/string falls back to a
  # polyfill without it), but exercising the real ICU implementation in CI
  # is closer to how consumers of the bundle will actually run it.
  PHP_EXTENSIONS: intl, mbstring

jobs:
  # Support matrix: every PHP version we claim to support against both
  # Symfony branches we claim to support. composer.json declares
  # "^6.4 || ^7.0" for each symfony/* package, which is correct for
  # publishing but leaves composer free to resolve either branch for
  # every cell - so a naive `composer update` here would silently run
  # the same Symfony version six times over and call it a matrix. Each
  # cell pins the symfony/* requirements to its own branch in its own
  # ephemeral checkout (nothing is committed) before installing, the
  # same technique the Symfony 8 canary job below uses. Verified locally
  # that ^6.4 resolves to 6.4.x and ^7.0 resolves to a distinct 7.x.
  tests:
    name: 'PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        symfony: ['^6.4', '^7.0']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v4
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-php${{ matrix.php }}-sf${{ matrix.symfony }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-sf${{ matrix.symfony }}-
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Pin composer.json to Symfony ${{ matrix.symfony }}
        env:
          SYMFONY_CONSTRAINT: ${{ matrix.symfony }}
        run: |
          php -r '
          $path = "composer.json";
          $json = json_decode(file_get_contents($path), true);
          $constraint = getenv("SYMFONY_CONSTRAINT");
          $symfonyPackages = [
              "symfony/framework-bundle",
              "symfony/yaml",
              "symfony/validator",
              "symfony/serializer",
              "symfony/console",
              "symfony/security-bundle",
              "symfony/string",
          ];
          foreach ($symfonyPackages as $package) {
              $json["require"][$package] = $constraint;
          }
          file_put_contents($path, json_encode($json, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --with-all-dependencies

      - name: Run test suite
        run: vendor/bin/phpunit

  # Lowest-bound sanity check: proves the floor of every constraint in
  # composer.json is a version the bundle actually builds and passes on,
  # not just a number nobody has installed in years.
  tests-lowest:
    name: Lowest dependencies (PHP 8.2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.2'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-php8.2-lowest-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php8.2-lowest-

      - name: Install lowest dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-lowest --prefer-stable

      - name: Run test suite
        run: vendor/bin/phpunit

  # Line coverage ratchet. Current coverage is 91.83%; the gate sits a
  # few points under that so incidental noise doesn't fail PRs, but any
  # real regression below the floor fails the job.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-php8.4-coverage-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-coverage-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run test suite with coverage
        run: vendor/bin/phpunit --coverage-clover=clover.xml

      - name: Enforce coverage threshold
        run: |
          php -r '
          $threshold = 90.0;
          $xml = simplexml_load_file("clover.xml");
          $metrics = $xml->project->metrics;
          $statements = (int) $metrics["statements"];
          $covered = (int) $metrics["coveredstatements"];
          $pct = $statements > 0 ? ($covered / $statements) * 100 : 0;
          printf("Line coverage: %.2f%% (%d/%d), threshold %.2f%%\n", $pct, $covered, $statements, $threshold);
          if ($pct < $threshold) {
              fwrite(STDERR, sprintf("Coverage %.2f%% dropped below the %.2f%% threshold\n", $pct, $threshold));
              exit(1);
          }
          '

  # Manifest hygiene: the file Packagist and every consumer's resolver
  # trusts has to be syntactically strict and free of known advisories.
  manifest:
    name: Manifest hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      # NOTE: as of this writing, composer.lock is known to be out of sync
      # with composer.json (the manifest was tightened without a matching
      # relock, since regenerating the lock needs a composer build with
      # ext-intl that isn't available everywhere). This job will be red
      # until that relock happens - that's a known, tracked gap, not a
      # broken CI config.
      - name: Validate composer.json
        run: composer validate --strict

      - name: Audit dependencies for known advisories
        run: composer audit

  # Non-blocking canary: previews Symfony 8 compatibility before it's a
  # supported target. composer.json declares "^6.4 || ^7.0" for each
  # symfony/* package (no separate conflict block), so this job raises
  # those constraints to ^8.0 in its own ephemeral checkout only -
  # nothing is committed - to see what would break, using the same
  # inline-patch technique as the tests job above.
  symfony8-canary:
    name: 'Canary: Symfony 8 (non-blocking)'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Point composer.json at Symfony 8
        run: |
          php -r '
          $path = "composer.json";
          $json = json_decode(file_get_contents($path), true);
          $symfonyPackages = [
              "symfony/framework-bundle",
              "symfony/yaml",
              "symfony/validator",
              "symfony/serializer",
              "symfony/console",
              "symfony/security-bundle",
              "symfony/string",
          ];
          foreach ($symfonyPackages as $package) {
              $json["require"][$package] = "^8.0";
          }
          file_put_contents($path, json_encode($json, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --with-all-dependencies

      - name: Run test suite
        run: vendor/bin/phpunit
