name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Lets the matrix be run against a commit that is already pushed - a released
  # tag, for instance - without inventing an empty commit to trigger it.
  workflow_dispatch:
  schedule:
    # Weekly run so newly published security advisories surface even
    # when nothing in the repository has changed.
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  # ext-intl is optional per composer.json (symfony/string falls back to a
  # polyfill without it), but exercising the real ICU implementation in CI
  # is closer to how consumers of the bundle will actually run it.
  PHP_EXTENSIONS: intl, mbstring

jobs:
  # Support matrix: every PHP version we claim to support against every
  # Symfony branch we claim to support. composer.json declares
  # "^6.4 || ^7.0 || ^8.0" for each symfony/* package, which is correct
  # for publishing but leaves composer free to resolve any branch for
  # every cell - so a naive `composer update` here would silently run
  # the same Symfony version a dozen times over and call it a matrix.
  # Each cell pins the symfony/* requirements to its own branch in its
  # own ephemeral checkout (nothing is committed) before installing. The
  # list of packages to pin is derived from composer.json rather than
  # written out, because a written-out one had already fallen five
  # packages behind the manifest and left their 6.4 branch untested.
  #
  # Symfony 8 requires PHP >= 8.4.1, so its cells on 8.2 and 8.3 are not
  # a gap in coverage - they are combinations that cannot exist, and
  # leaving them in would fail the build for the wrong reason.
  tests:
    name: 'PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        symfony: ['^6.4', '^7.0', '^8.0']
        exclude:
          - php: '8.2'
            symfony: '^8.0'
          - php: '8.3'
            symfony: '^8.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-php${{ matrix.php }}-sf${{ matrix.symfony }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-sf${{ matrix.symfony }}-
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Pin composer.json to Symfony ${{ matrix.symfony }}
        env:
          SYMFONY_CONSTRAINT: ${{ matrix.symfony }}
        run: |
          php -r '
          $path = "composer.json";
          $json = json_decode(file_get_contents($path), true);
          $constraint = getenv("SYMFONY_CONSTRAINT");
          // Derived from the manifest, never listed by hand: a hardcoded list silently stops
          // covering a package the moment one is added to require, and that is exactly what
          // happened - config, dependency-injection, http-foundation, http-kernel and routing
          // were absent, so a "6.4" cell resolved them to 7.4 and the 6.4 branch of those five
          // was never exercised by any job.
          $symfonyPackages = array_values(array_filter(
              array_keys($json["require"]),
              static fn (string $package): bool => str_starts_with($package, "symfony/")
          ));
          foreach ($symfonyPackages as $package) {
              $json["require"][$package] = $constraint;
          }
          file_put_contents($path, json_encode($json, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --with-all-dependencies

      - name: Run test suite
        run: vendor/bin/phpunit

  # Lowest-bound sanity check: proves the floor of every constraint in
  # composer.json is a version the bundle actually builds and passes on,
  # not just a number nobody has installed in years.
  tests-lowest:
    name: Lowest dependencies (PHP 8.2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-php8.2-lowest-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php8.2-lowest-

      - name: Install lowest dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-lowest --prefer-stable

      - name: Run test suite
        run: vendor/bin/phpunit

  # Line coverage ratchet. Current coverage is 91.84%; the gate sits a
  # few points under that so incidental noise doesn't fail PRs, but any
  # real regression below the floor fails the job.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-php8.4-coverage-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-coverage-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run test suite with coverage
        run: vendor/bin/phpunit --coverage-clover=clover.xml

      - name: Enforce coverage threshold
        run: |
          php -r '
          $threshold = 90.0;
          $xml = simplexml_load_file("clover.xml");
          $metrics = $xml->project->metrics;
          $statements = (int) $metrics["statements"];
          $covered = (int) $metrics["coveredstatements"];
          $pct = $statements > 0 ? ($covered / $statements) * 100 : 0;
          printf("Line coverage: %.2f%% (%d/%d), threshold %.2f%%\n", $pct, $covered, $statements, $threshold);
          if ($pct < $threshold) {
              fwrite(STDERR, sprintf("Coverage %.2f%% dropped below the %.2f%% threshold\n", $pct, $threshold));
              exit(1);
          }
          '

  # Static analysis: PHPStan against src/ (tests/ are excluded — they
  # deliberately lean on mocks, reflection and inline-FQCN that would just
  # be noise) plus a PHP-CS-Fixer dry-run to enforce the formatting the
  # fix job applies locally.
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-php8.4-static-analysis-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-static-analysis-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHP-CS-Fixer (dry run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  # Manifest hygiene: the file Packagist and every consumer's resolver
  # trusts has to be syntactically strict and free of known advisories.
  manifest:
    name: Manifest hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      # --locked, because this job deliberately never installs: it checks the
      # manifest and the lockfile, not a vendor tree. Without the flag composer
      # audit refuses outright ("No installed packages found") and the job fails
      # for want of a directory rather than for anything it found.
      - name: Audit dependencies for known advisories
        run: composer audit --locked

  # Symfony 9 canary: the same technique the matrix uses, pointed at a
  # branch that is not a supported target yet. It exists to see a breaking
  # change coming rather than to gate anything, so it does not fail the
  # build. Symfony 8 used to sit here; it is a matrix cell now, which is
  # what this job is for - promoting a branch once it actually passes.
  symfony9-canary:
    name: 'Canary: Symfony 9 (non-blocking)'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Point composer.json at Symfony 9
        run: |
          php -r '
          $path = "composer.json";
          $json = json_decode(file_get_contents($path), true);
          $symfonyPackages = array_values(array_filter(
              array_keys($json["require"]),
              static fn (string $package): bool => str_starts_with($package, "symfony/")
          ));
          foreach ($symfonyPackages as $package) {
              $json["require"][$package] = "^9.0";
          }
          file_put_contents($path, json_encode($json, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      # Symfony 9 has no releases yet, so the resolver has nothing to install and
      # this job was red on every commit for a reason that carries no
      # information. An alarm that is always ringing gets ignored, including on
      # the day it finally means something - so "the branch does not exist yet"
      # is reported and passed over, and only a branch that exists and breaks
      # turns this red.
      - name: Install dependencies
        id: install
        run: |
          if composer update --no-interaction --no-progress --prefer-dist --with-all-dependencies; then
            echo 'resolved=true' >> "$GITHUB_OUTPUT"
          else
            echo 'resolved=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Symfony 9 cannot be resolved yet - nothing to preview. This job starts reporting once the branch is published.'
          fi

      - name: Run test suite
        if: steps.install.outputs.resolved == 'true'
        run: vendor/bin/phpunit
